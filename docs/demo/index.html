<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Árvore Viva Demonstração</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: palco em tela cheia + barra superior + caixa de ferramentas à esquerda + painel da pessoa à direita */
:root{--f1:#0b1026;--f2:#1d2a5c;--sup:rgba(16,22,48,.84);--sup2:rgba(255,255,255,.08);--txt:#eef1fb;--mud:#a9b2d6;--bor:rgba(255,255,255,.16);--ac:#ffc861;--fd:"Fraunces",Georgia,serif;--fb:"Nunito Sans",system-ui,sans-serif;color-scheme:dark}
body[data-tema="floresta"]{--f1:#06190f;--f2:#1f4d2c;--sup:rgba(10,32,20,.86);--mud:#b7d3bd;--ac:#f2d36b}
body[data-tema="por-do-sol"]{--f1:#2a0b2e;--f2:#c2410c;--sup:rgba(52,16,40,.84);--mud:#f4c7b4;--ac:#ffd166}
body[data-tema="oceano"]{--f1:#021a2b;--f2:#0e7490;--sup:rgba(4,34,52,.86);--mud:#a8dbe8;--ac:#7cf5d8}
body[data-tema="neon"]{--f1:#05010c;--f2:#2b0a4a;--sup:rgba(14,6,28,.88);--mud:#c9b6f2;--ac:#ff4fd8}
body[data-tema="aurora"]{--f1:#030712;--f2:#134e4a;--sup:rgba(6,16,26,.86);--mud:#b4e7d9;--ac:#a78bfa}
body[data-tema="pergaminho"]{--f1:#f7efdc;--f2:#e3cfa3;--sup:rgba(255,250,238,.93);--sup2:rgba(80,50,10,.07);--txt:#2f2312;--mud:#6e5a3a;--bor:rgba(80,50,10,.22);--ac:#9a5b13;color-scheme:light}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,var(--f2),var(--f1) 70%) fixed;background-color:var(--f1);color:var(--txt);font:15px/1.45 var(--fb);overflow:hidden}
#palco{position:fixed;inset:0}#palco canvas,#palco svg{display:block;width:100%;height:100%;touch-action:none;user-select:none}
.vidro{background:var(--sup);border:1px solid var(--bor);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.barra{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;z-index:5}.barra>*{pointer-events:auto}
.marca{padding:8px 14px}.marca b{font:600 1.15rem var(--fd);display:block;color:var(--ac)}.marca span{font-size:.72rem;color:var(--mud)}
.grupo{display:flex;gap:4px;padding:5px;flex-wrap:wrap;align-items:center}
button,input,select{font:inherit;color:var(--txt);background:var(--sup2);border:1px solid var(--bor);border-radius:9px;min-height:36px;padding:0 12px}
button{cursor:pointer;font-weight:700}button:hover{border-color:var(--ac)}button[aria-pressed="true"],.prim{background:var(--ac)!important;color:#1a1205!important;border-color:var(--ac)!important}
button:disabled{opacity:.4;cursor:default}select option{background:#1b1f33;color:#fff}body[data-tema="pergaminho"] select option{background:#fff;color:#2f2312}
input[type=color]{padding:2px;width:44px}input[type=range]{padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.temas{display:flex;gap:6px;padding:6px 8px;align-items:center}.rotulo{font-size:.72rem;color:var(--mud);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bola{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--bor)}.bola[aria-pressed="true"]{border-color:#fff!important;box-shadow:0 0 0 2px var(--ac)}
/* Caixa de ferramentas */
#ferr{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(var(--topo,80px) + env(safe-area-inset-top,0px));width:236px;max-height:calc(100% - 100px);overflow-y:auto;padding:12px;z-index:5;display:grid;gap:10px}
#ferr h3{margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mud)}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.grade button{padding:0;min-height:44px;display:grid;place-items:center}
.grade svg{width:26px;height:26px}.ferr2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ferr2 button{padding:0 6px;font-size:.85rem}
.dicaf{font-size:.78rem;color:var(--mud);background:var(--sup2);border-radius:9px;padding:8px}
aside{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--topo,80px) + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 24px));overflow-y:auto;padding:18px;z-index:5}
aside h2{font:600 1.3rem var(--fd);margin:8px 0 2px;text-wrap:balance}
.foto{width:120px;height:120px;margin:0 auto;display:grid;place-items:center;font:600 2.4rem var(--fd);color:#fff;background-size:cover;background-position:center;border:4px solid var(--ac);border-radius:50%}
.centro{text-align:center}.acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.mud{color:var(--mud)}.selo{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sup2);border:1px solid var(--bor);margin:2px}
dl{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:.9rem;margin:12px 0}dt{color:var(--mud)}dd{margin:0;min-width:0}
aside h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mud);margin:16px 0 6px}
.pessoas{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;min-height:36px;font-size:.85rem;text-align:left}
.mini{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-size:.7rem;color:#fff;flex:none}
.rot{font-size:.68rem;font-weight:800;color:var(--ac);display:block}
.res,.historia{background:var(--sup2);border:1px solid var(--bor);border-radius:10px;padding:10px;margin-top:8px;font-size:.9rem}.res b{color:var(--ac)}
form{display:grid;gap:8px}label{display:grid;gap:3px;font-size:.8rem;color:var(--mud)}
.vida{position:relative;height:10px;border-radius:99px;background:var(--sup2);margin:6px 0 2px;overflow:hidden}.vida i{position:absolute;top:0;bottom:0;border-radius:99px}.eixo{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mud)}
/* Menu de contexto, dica, avisos */
#menu{position:fixed;z-index:30;min-width:220px;max-width:340px;max-height:calc(100% - 16px);overflow-y:auto;padding:6px;display:grid;gap:2px}
#menu button{text-align:left;border:0;background:none;min-height:34px;font-weight:600;font-size:.88rem;display:flex;gap:8px;align-items:center}#menu button:hover{background:var(--sup2)}
#menu .sep{height:1px;background:var(--bor);margin:4px 2px}#menu .tit{font-size:.7rem;color:var(--mud);padding:4px 10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
#menu .linha{display:flex;gap:4px;padding:2px 6px;flex-wrap:wrap}#menu .linha button{padding:0 8px;border:1px solid var(--bor);min-height:30px;font-size:.8rem}
#dica{position:fixed;z-index:8;pointer-events:none;padding:6px 10px;font-size:.82rem;max-width:280px}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:7;padding:12px 16px;max-width:min(560px,calc(100% - 24px))}#aviso b{color:var(--ac)}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);padding:8px 14px;z-index:40}
#guia{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:16px}#guia>div{max-width:460px;padding:22px}#guia h2{font:600 1.3rem var(--fd);margin:0 0 8px;color:var(--ac)}
.passos{display:flex;gap:6px;margin:12px 0}.passos i{flex:1;height:4px;border-radius:4px;background:var(--sup2)}.passos i.on{background:var(--ac)}
/* Animações dos balões e linhas (SVG) */
.bal{transform-box:fill-box;transform-origin:center}
#efeito{position:fixed;inset:0;pointer-events:none;z-index:0}#palco{z-index:1}
svg .bal,svg .lin{animation-duration:calc(var(--dur,3s) / var(--vel,1))!important}
svg.anim-flutuar .bal{animation:flutuar 3.2s ease-in-out infinite}
svg.anim-pular .bal{animation:pular 1.6s cubic-bezier(.3,0,.5,1) infinite;--dur:1.6s}@keyframes pular{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}55%{transform:translateY(0) scale(1.08,.92)}}
svg.anim-respirar .bal{animation:respirar 4s ease-in-out infinite;--dur:4s}@keyframes respirar{50%{opacity:.55;transform:scale(.95)}}
svg.anim-coracao .bal{animation:batida 1.3s ease-in-out infinite;--dur:1.3s}@keyframes batida{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.12)}28%{transform:scale(1.04)}}
svg.anim-orbita .bal{animation:orbita 5s linear infinite;--dur:5s}@keyframes orbita{0%{transform:translate(8px,0)}25%{transform:translate(0,8px)}50%{transform:translate(-8px,0)}75%{transform:translate(0,-8px)}100%{transform:translate(8px,0)}}
svg.anim-girar .bal{animation:girarb 8s linear infinite;--dur:8s}@keyframes girarb{to{transform:rotate(360deg)}}
svg.anim-neon .bal{animation:neon 1.8s steps(1) infinite;--dur:1.8s}@keyframes neon{0%,60%,100%{filter:drop-shadow(0 0 12px var(--ac)) brightness(1.2)}70%,85%{filter:none;opacity:.7}}
svg.anim-onda .bal{animation:ondab 3s ease-in-out infinite;--dur:3s}@keyframes ondab{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-4deg)}75%{transform:translateY(8px) rotate(4deg)}}
svg.anim-pular .lin,svg.anim-neon .lin,svg.anim-coracao .lin{stroke-dasharray:14 10;animation:fluxo 1.2s linear infinite}@keyframes flutuar{50%{transform:translateY(-10px)}}
svg.anim-pulsar .bal{animation:pulsar 2.4s ease-in-out infinite}@keyframes pulsar{50%{transform:scale(1.07)}}
svg.anim-balancar .bal{animation:balancar 3s ease-in-out infinite}@keyframes balancar{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
svg.anim-brilho .bal{animation:brilho 2.2s ease-in-out infinite}@keyframes brilho{50%{filter:drop-shadow(0 0 14px var(--ac))}}
svg.anim-arco .bal{animation:arco 6s linear infinite}@keyframes arco{to{filter:hue-rotate(360deg)}}
[hidden]{display:none!important}
@media (max-width:600px){.marca,#bver,#bguia{display:none!important}.barra{gap:6px}.grupo{padding:4px}.barra button{padding:0 9px}#busca{width:120px}}
/* Popovers da barra e painéis recolhíveis */
.pop{position:fixed;z-index:12;padding:12px;display:grid;gap:10px;max-width:min(560px,calc(100% - 24px))}.popg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pop .chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--txt);min-height:34px;cursor:pointer}.pop .chk input{width:18px;height:18px;min-height:0}
.fechar{position:absolute;top:8px;right:8px;width:30px;min-height:30px;padding:0;border-radius:8px;font-size:1rem}
#ferr,aside{transition:transform .25s ease,opacity .25s}
.aba{position:fixed;z-index:6;top:calc(var(--topo,80px));min-height:40px}#abaFerr{left:max(12px,env(safe-area-inset-left,0px))}#abaPainel{right:max(12px,env(safe-area-inset-right,0px))}
#zoomc{position:fixed;right:calc(max(12px,env(safe-area-inset-right,0px)) + var(--dir,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:4px;padding:5px}#zoomc button{width:38px;padding:0}
#mapa{position:fixed;right:calc(max(12px,env(safe-area-inset-right,0px)) + var(--dir,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;width:200px;height:130px;cursor:pointer;padding:0}
body.sem-mapa #mapa,body.modo3d #mapa{display:none}
body.sem-barra .barra,body.sem-ferr #ferr,body.sem-painel aside{display:none!important}
#mostrarUI{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:9}
body.pausado svg .bal,body.pausado svg .lin{animation-play-state:paused!important}
svg.anim-fluxo .lin,svg.anim-brilho .lin{stroke-dasharray:14 10;animation:fluxo 1.2s linear infinite}@keyframes fluxo{to{stroke-dashoffset:-24}}
.novo{animation:entrar .5s cubic-bezier(.3,1.6,.5,1)}@keyframes entrar{from{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){svg .bal,svg .lin,.novo{animation:none!important}}
@media (max-width:900px){#mapa{display:none}body:not(.sem-painel) #zoomc{bottom:calc(40% + 24px)}body:not(.sem-ferr) #zoomc{display:none}#ferr{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;right:max(12px,env(safe-area-inset-right,0px));max-height:34%}aside{top:auto;height:40%;left:max(12px,env(safe-area-inset-left,0px));width:auto;bottom:calc(36% + 20px)}.marca span{display:none}}
</style>
</head>
<body>
<canvas id="efeito" aria-hidden="true"></canvas><div id="palco"></div>
<div class="barra">
  <div class="marca vidro"><b>Árvore Viva</b><span>Editor da árvore · personagens fictícios</span></div>
  <div class="grupo vidro" role="group" aria-label="Visualização"><button id="b2d" type="button" aria-pressed="true">2D editável</button><button id="b3d" type="button">3D</button><button id="bver" type="button">Ver tudo</button><button id="bguia" type="button">Como usar</button><button id="batal" type="button" title="Atalhos de teclado (?)">⌨</button></div>
  <div class="grupo vidro"><button id="bdesf" type="button" title="Desfazer (Ctrl+Z)">↶</button><button id="brefz" type="button" title="Refazer (Ctrl+Y)">↷</button><input id="busca" list="nomes" placeholder="Buscar pessoa…" aria-label="Buscar pessoa"><datalist id="nomes"></datalist></div>
  <div class="grupo vidro"><button id="bapar" type="button" aria-expanded="false">🎨 Aparência ▾</button><button id="bpain" type="button" aria-expanded="false">▤ Painéis ▾</button><button id="bfoco" type="button" title="Modo foco: só a árvore (H)">⛶ Foco</button></div>
  <div id="popApar" class="pop vidro" hidden><div class="popg"><span class="rotulo">Animação</span><select id="anim" aria-label="Animação"><option value="nenhuma">Nenhuma</option><option value="flutuar">Flutuar</option><option value="pulsar">Pulsar</option><option value="balancar">Balançar</option><option value="fluxo">Linhas em movimento</option><option value="brilho">Brilho e fluxo</option><option value="arco">Arco-íris</option><option value="pular">Pular</option><option value="respirar">Respirar</option><option value="coracao">Batida de coração</option><option value="orbita">Órbita</option><option value="onda">Onda do mar</option><option value="girar">Girar balões</option><option value="neon">Neon piscando</option></select>
  <select id="efsel" aria-label="Efeito de fundo"><option value="estrelas">Fundo: estrelas</option><option value="nenhum">Fundo: nada</option><option value="vagalumes">Fundo: vaga-lumes</option><option value="folhas">Fundo: folhas caindo</option><option value="neve">Fundo: neve</option><option value="bolhas">Fundo: bolhas</option><option value="confete">Fundo: confete</option><option value="coracoes">Fundo: corações</option></select>
  <label class="rotulo" style="display:flex;align-items:center;gap:4px">Velocidade<input id="vel" type="range" min="0.3" max="3" step="0.1" value="1" aria-label="Velocidade das animações" style="width:80px"></label>
  <button id="bgira" type="button" title="Girar a cena 3D (separado das animações)">Girar 3D</button><button id="bpausa" type="button" title="Pausar ou continuar todas as animações">⏸ Pausar</button></div>
  <div class="temas" role="group" aria-label="Tema do fundo"><span class="rotulo">Tema</span></div></div>
  <div id="popPain" class="pop vidro" hidden></div>
</div>
<div id="ferr" class="vidro" aria-label="Ferramentas"></div>
<button id="abaFerr" class="aba vidro" type="button" hidden title="Mostrar ferramentas (T)">🛠 Ferramentas</button><button id="abaPainel" class="aba vidro" type="button" hidden title="Mostrar detalhes (I)">Detalhes ◂</button>
<div id="zoomc" class="vidro" role="group" aria-label="Zoom"><button id="zmais" type="button" title="Aproximar (+)">+</button><button id="zmenos" type="button" title="Afastar (−)">−</button><button id="zfit" type="button" title="Ver tudo (F)">⤢</button><button id="zsel" type="button" title="Centralizar pessoa escolhida (C)">◎</button><button id="zmapa" type="button" title="Minimapa (N)">▦</button></div>
<canvas id="mapa" class="vidro" width="200" height="130" aria-label="Minimapa: clique para ir até a região"></canvas>
<aside id="painel" class="vidro"></aside>
<button id="mostrarUI" class="vidro" type="button" hidden>Mostrar menus (H)</button><div id="dica" class="vidro" hidden></div><div id="aviso" class="vidro" hidden></div><div id="menu" class="vidro" hidden role="menu"></div>
<input type="file" id="arquivo" accept="image/*" hidden>
<script>
// append/replaceChildren aceitam listas e ignoram vazios
for(const m of["append","replaceChildren"]){const o=Element.prototype[m];Element.prototype[m]=function(...x){return o.apply(this,x.flat(9).filter(y=>y!=null&&y!==false))}}
// ================= Dados =================
const FAM={Corvalli:"#ff6b6b",Brandemar:"#4dabf7",Rando:"#b197fc",Arantes:"#38d9a9",Teixeira:"#ffa94d",Mendes:"#69db7c",Nogueira:"#ffd43b",Sales:"#f783ac",Ferraz:"#66d9e8"};
const PALETA=["#ff6b6b","#4dabf7","#b197fc","#38d9a9","#ffa94d","#69db7c","#ffd43b","#f783ac","#66d9e8","#e599f7"];
const corSobrenome=n=>{const t=n.trim().split(/\s+/);for(const s of t.slice(1).reverse())if(FAM[s])return FAM[s];const s=t[t.length-1]||"";let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return PALETA[h%PALETA.length]};
const TIPOS={filiacao:["Filiação (pai/mãe → filho)","#ffffff"],adocao:["Adoção","#63e6be"],casamento:["Casamento","#ffd166"],uniao:["União / namoro","#f783ac"],irmaos:["Irmãos","#74c0fc"],outro:["Outro vínculo","#ced4da"]};
const ESTILOS={curva:"Curva",reta:"Reta",cotovelo:"Cotovelo",onda:"Ondulada"};
const FORMAS={circulo:"Círculo",quadrado:"Quadrado",hexagono:"Hexágono",estrela:"Estrela",coracao:"Coração",diamante:"Diamante",escudo:"Escudo",flor:"Flor"};
const uid=()=>Math.random().toString(36).slice(2,9);
function demo(){const P=[["matteo","Matteo Corvalli","M","1868","1931","Gênova, Itália"],["giuseppina","Giuseppina Rando Corvalli","F","1872","1940","Gênova, Itália"],["joaquim","Joaquim Brandemar","M","1870","1935","Braga, Portugal"],["mariaceu","Maria do Céu Arantes","F","1874","1898","Braga, Portugal"],["analuisa","Ana Luísa Teixeira Brandemar","F","1876","1950","Campinas, SP"],["pietro","Pietro Corvalli","M","1895","1962","São Paulo, SP"],["rosa","Rosa Corvalli Sales","F","1898","1979","São Paulo, SP"],["augusto","Augusto Arantes Brandemar","M","1896","1970","Campinas, SP"],["celina","Celina Brandemar Corvalli","F","1900","1978","Campinas, SP"],["henrique","Henrique Corvalli","M","1925","2001","São Paulo, SP"],["lucia","Lúcia Corvalli Ferraz","F","1928","2015","São Paulo, SP"],["dalva","Dalva Mendes Corvalli","F","1930","2010","Ribeirão Preto, SP"],["claudio","Cláudio Rando Sales","M","1924","1990","São Paulo, SP"],["rubens","Rubens Brandemar","M","1925","1999","Campinas, SP"],["marina","Marina Corvalli","F","1955","","São Paulo, SP"],["paulo","Paulo Corvalli","M","1958","","São Paulo, SP"],["tiago","Tiago Corvalli","M","1962","","Ribeirão Preto, SP"],["eduardo","Eduardo Nogueira","M","1953","","Curitiba, PR"],["beatriz","Beatriz Corvalli Nogueira","F","1985","","Curitiba, PR"]];
  const F=[["matteo","pietro"],["giuseppina","pietro"],["matteo","rosa"],["giuseppina","rosa"],["joaquim","augusto"],["mariaceu","augusto"],["joaquim","celina"],["analuisa","celina"],["pietro","henrique"],["celina","henrique"],["pietro","lucia"],["celina","lucia"],["rosa","claudio"],["augusto","rubens"],["henrique","marina"],["dalva","marina"],["henrique","paulo"],["dalva","paulo"],["henrique","tiago","adocao"],["dalva","tiago","adocao"],["marina","beatriz"],["eduardo","beatriz"]];
  const C=[["matteo","giuseppina","1893"],["joaquim","mariaceu","1895","viuvez em 1898"],["joaquim","analuisa","1899"],["pietro","celina","1921"],["henrique","dalva","1953"],["marina","eduardo","1983","divórcio em 1994"]];
  const p={};P.forEach(([id,n,s,b,d,l])=>p[id]={id,n,s,b,d,l,foto:null,forma:id==="beatriz"?"estrela":"circulo",cor:null,tam:1});
